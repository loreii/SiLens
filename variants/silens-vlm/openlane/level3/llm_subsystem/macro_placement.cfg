# ==============================================================================
# Macro Placement Configuration for llm_subsystem
# ==============================================================================
# Target area: 20000µm × 20000µm (~400mm²)
#
# Layout strategy:
#   - 30 transformer blocks in 5×6 grid (main processing array)
#   - Embedding block at top-left (input stage)
#   - Final RMS norm at bottom-right (output stage)
#   - Routing channels between macro groups
#
# Transformer block size: ~3600µm × 3600µm (~13mm²)
# Embedding block size: ~3900µm × 3900µm (~15mm²)
# RMS norm block size: ~700µm × 700µm
#
# Grid layout (5 columns × 6 rows):
#   Col spacing: 3800µm (3600µm block + 200µm channel)
#   Row spacing: 3000µm (optimized for vertical routing)
#
# Format: macro_name X Y orientation
# Coordinates in microns from lower-left corner
# Orientations: N (north), S, E, W, FN (flipped north), FS, FE, FW
# ==============================================================================

# ------------------------------------------------------------------------------
# Embedding Block - Top-Left Corner
# Size: ~3900µm × 3900µm (~15mm²)
# Handles token embedding lookup and position encoding
# ------------------------------------------------------------------------------
u_embedding 200 15800 N

# ------------------------------------------------------------------------------
# Transformer Blocks - 5×6 Grid Layout
# Size: ~3600µm × 3600µm each (~13mm²)
# Sequential processing: layer 0 at top-left, layer 29 at bottom-right
# Data flows left-to-right, top-to-bottom
# ------------------------------------------------------------------------------

# Row 5 (top row, layers 0-4)
# Y = 15800 - 200 - 3600 = 12000 (below embedding, with channel)
# Note: Embedding feeds into Layer 0, so embedding output -> first transformer input
# Layer numbering: 0-29 (30 total layers)

# Row 5 (Y = 12000) - Layers 0-4 (closest to embedding output)
u_transformer_00 4400 12000 N
u_transformer_01 8200 12000 N
u_transformer_02 12000 12000 N
u_transformer_03 15800 12000 N
u_transformer_04 200 12000 FN

# Row 4 (Y = 9000) - Layers 5-9
u_transformer_05 200 9000 N
u_transformer_06 4000 9000 N
u_transformer_07 7800 9000 N
u_transformer_08 11600 9000 N
u_transformer_09 15400 9000 N

# Row 3 (Y = 6000) - Layers 10-14
u_transformer_10 200 6000 N
u_transformer_11 4000 6000 N
u_transformer_12 7800 6000 N
u_transformer_13 11600 6000 N
u_transformer_14 15400 6000 N

# Row 2 (Y = 3000) - Layers 15-19
u_transformer_15 200 3000 N
u_transformer_16 4000 3000 N
u_transformer_17 7800 3000 N
u_transformer_18 11600 3000 N
u_transformer_19 15400 3000 N

# Row 1 (Y = 200) - Layers 20-24 (near bottom)
u_transformer_20 200 200 N
u_transformer_21 4000 200 N
u_transformer_22 7800 200 N
u_transformer_23 11600 200 N
u_transformer_24 15400 200 N

# Row 0 - Layers 25-29 moved to right side vertical column
# These fit in the remaining space on the right
# Y positions staggered for routing
u_transformer_25 16200 15800 N
u_transformer_26 16200 12200 N
u_transformer_27 16200 8600 N
u_transformer_28 16200 5000 N
u_transformer_29 16200 1400 N

# ------------------------------------------------------------------------------
# Final RMS Norm Block - After last transformer layer
# Size: ~700µm × 700µm
# Positioned near layer 29 output for minimal routing
# ------------------------------------------------------------------------------
u_final_rms_norm 19000 1400 N

# ==============================================================================
# Placement Notes:
# ==============================================================================
#
# 1. Data Flow:
#    - Token input → Embedding (top-left)
#    - Embedding → Layer 0 → Layer 1 → ... → Layer 29
#    - Layer 29 → Final RMS Norm → LM Head (synthesized logic)
#    - LM Head → Output logits
#
# 2. Weight Sharing:
#    - Single transformer_block_llm instantiated in RTL
#    - 30 placements shown here are for PHYSICAL synthesis reference
#    - Actual RTL uses time-multiplexed single block with weight switching
#
# 3. KV Cache Routing:
#    - Each transformer block has 9 heads with KV cache interface
#    - 30 layers × 9 heads = 270 cache ports
#    - External DDR3 interface arbitrated through kv_cache_* signals
#
# 4. Power Grid:
#    - VDD/VSS rings around perimeter
#    - Power straps every 1000µm horizontal and vertical
#    - Decoupling capacitors distributed across unused area
#
# 5. Clock Distribution:
#    - Single clock domain (clk)
#    - H-tree clock distribution recommended
#    - Target skew: <500ps across entire die
#
# 6. Alternative Physical Implementation:
#    - For actual synthesis, may instantiate single transformer block
#    - Weight memory interface handles layer-specific weight loading
#    - This placement shows conceptual arrangement for full instantiation
#
# ==============================================================================
