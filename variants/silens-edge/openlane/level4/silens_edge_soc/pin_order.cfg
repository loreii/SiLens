# =============================================================================
# SiLens Edge SoC - Pin Order Configuration for QFN-48
# =============================================================================
# Die: 7000µm × 7000µm
# Package: QFN-48 (48 pins) or small BGA-100
#
# Pin allocation (48 total):
#   - Power:     8 pins (VDD×4, VSS×4 at corners)
#   - SPI:       6 pins (on South edge)
#   - I2C:       4 pins (on South edge)
#   - GPIO:     16 pins (on East edge)
#   - Control:   6 pins (on West edge)
#   - Clock/Rst: 4 pins (on North edge)
#   - Status:    4 pins (on North edge)
#
# Edge strategy for QFN-48:
#   South (pins 1-12):   SPI interface + I2C (high-speed serial)
#   East  (pins 13-24):  GPIO bank (general purpose)
#   North (pins 25-36):  Clock, reset, status, spare
#   West  (pins 37-48):  Control, interrupt, debug
#
# Note: Power pins distributed at corners for robust power delivery
# =============================================================================

#S  (South - SPI + I2C Interface - pins 1-12)
# SPI is primary high-speed interface for image data
spi_clk
spi_mosi
spi_miso
spi_cs_n
spi_irq_n
spi_rdy
# I2C for configuration and slow control
i2c_scl
i2c_sda

#E  (East - GPIO Bank - pins 13-28)
# 16 GPIOs for triggers, sensors, actuators
gpio\[0\]
gpio\[1\]
gpio\[2\]
gpio\[3\]
gpio\[4\]
gpio\[5\]
gpio\[6\]
gpio\[7\]
gpio\[8\]
gpio\[9\]
gpio\[10\]
gpio\[11\]
gpio\[12\]
gpio\[13\]
gpio\[14\]
gpio\[15\]

#N  (North - Clock, Reset, Status - pins 29-40)
# Clock and reset
clk_ref
rst_n
# Classification output (active strobe + class ID)
class_valid
class_id\[0\]
class_id\[1\]
class_id\[2\]
class_id\[3\]
class_id\[4\]
class_id\[5\]
class_id\[6\]
class_id\[7\]
class_id\[8\]
class_id\[9\]

#W  (West - Control and Debug - pins 41-48)
# Control
frame_start
abort
mode\[0\]
mode\[1\]
# Status
busy
done
error
# Debug/test
test_mode
