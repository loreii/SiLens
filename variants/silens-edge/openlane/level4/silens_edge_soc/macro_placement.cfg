# =============================================================================
# SiLens Edge SoC - Level 4 Macro Placement
# =============================================================================
# Die: 7000µm × 7000µm = 49mm² (~50mm² target)
# Target: QFN-48 compatible, 200MHz, 3W TDP
#
# Floorplan Strategy:
# - IO block on bottom edge (near package pins)
# - Vision encoder in lower-left quadrant (largest block)
# - SRAM in upper-right (thermal isolation from compute)
# - Classifier in lower-right (short path from vision)
#
#    0        2000       4000       6500  7000
#    +----------+---------+---------+----+ 7000
#    |                    |              |
#    |    ROUTING/        |    SRAM      |
#    |    TOP LOGIC       |   256KB      |
#    |                    |   (~10mm²)   |
#    +--------------------+              | 6500
#    |                    +--------------+ 
#    |                    |              |
#    |    VISION NANO     |  CLASSIFIER  |
#    |      (~15mm²)      |    HEAD      |
#    |    NanoViT-12M     |   (~10mm²)   |
#    |                    |              |
#    +--------------------+--------------+ 3050
#    |                                   |
#    |          IO EDGE (~5mm²)          |
#    |    SPI + I2C + GPIO + Control     |
#    +-----------------------------------+ 50
#   50                                  6950
#
# Total area breakdown:
#   Vision Nano:    15mm² (vision encoder)
#   Classifier:     10mm² (classification head)  
#   SRAM 256KB:     10mm² (activation buffer)
#   IO Edge:         5mm² (interfaces)
#   Routing/Top:    10mm² (interconnect + glue logic)
#   --------------------------------
#   Total:          50mm²
#
# Macro placement format: <instance_name> <x> <y> <orientation>
# =============================================================================

# IO Edge Subsystem: ~5mm² (6850µm × 1300µm)
# Position: Bottom edge, spanning width for easy package pin access
# Contains: SPI master/slave, I2C, GPIO, control registers
u_io_edge  50 50 N

# Vision Nano Subsystem: ~15mm² (3900µm × 3850µm)
# Position: Lower-left quadrant above IO
# Contains: 6× NanoViT transformer blocks, patch embedding, projector
# This is the largest macro - placed for optimal thermal distribution
u_vision_nano  50 1400 N

# Classifier Head: ~10mm² (2850µm × 3500µm)  
# Position: Lower-right, adjacent to vision for short feature path
# Contains: MLP classifier, softmax, output staging
u_classifier_head  4000 1400 N

# SRAM 256KB Activation Buffer: ~10mm² (2850µm × 3500µm)
# Position: Upper-right, away from hot compute blocks
# Contains: Dual-port SRAM for activation double-buffering
# Shares interface with both vision and classifier
u_sram_256kb  4000 5000 N

# =============================================================================
# Routing Channels
# =============================================================================
# Horizontal channel at y=1400 (IO to compute blocks)
# Vertical channel at x=4000 (vision-classifier boundary)
# Upper horizontal channel at y=5000 (SRAM interface)
#
# Key signal routes:
# - IO → Vision: Control/config via SPI registers
# - Vision → Classifier: 192-wide feature vector (short path)
# - Vision ↔ SRAM: Activation read/write (intermediate storage)
# - Classifier → IO: Classification result (10-bit class + confidence)
# - Clock tree: Centered distribution for balanced skew
# =============================================================================

# =============================================================================
# Power Grid Strategy (3W TDP)
# =============================================================================
# - Main VDD/VSS rings around periphery
# - Vertical straps at x = 2000, 4000 (between macros)
# - Horizontal straps at y = 1400, 5000 (channel areas)
# - Each macro has dedicated power tap points
# - Decoupling cells in routing channels
#
# Current estimate @ 1.8V:
#   Vision Nano:    1.5W (~830mA)
#   Classifier:     0.8W (~440mA)
#   SRAM:           0.4W (~220mA)
#   IO:             0.2W (~110mA)
#   Top/Routing:    0.1W (~55mA)
#   Total:          3.0W (~1.67A)
# =============================================================================
