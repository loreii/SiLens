<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title }} | {{ site.title }}</title>
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  
  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
</head>
<body>
  <header class="page-header">
    <h1 class="project-name">{{ site.title }}</h1>
    <h2 class="project-tagline">{{ site.description }}</h2>
    
    <nav class="main-nav">
      {% for item in site.nav %}
        <a href="{{ site.baseurl }}{{ item.url }}" class="btn">{{ item.title }}</a>
      {% endfor %}
      <a href="https://github.com/loreii/SiLens" class="btn">GitHub</a>
    </nav>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>
        <strong>SiLens™</strong> — Open-Source Hardwired Vision-Language AI Accelerator
      </p>
      <p>
        <a href="https://github.com/loreii/SiLens">GitHub</a> |
        <a href="{{ site.baseurl }}/faq/">FAQ</a> |
        <a href="mailto:hello@silens.ai">Contact</a>
      </p>
      <p class="copyright">
        © 2026 SiLens Technologies. Licensed under Apache 2.0.
      </p>
    </div>
  </footer>
</body>
</html>
