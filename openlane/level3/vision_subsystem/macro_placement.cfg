# =============================================================================
# Vision Subsystem - Macro Floorplan Configuration
# =============================================================================
# Level 3 hierarchical block containing 12 transformer blocks in 3×4 grid
# Target die size: 15800µm × 15800µm (~250mm²)
#
# Grid Layout (3 columns × 4 rows):
#   - Each transformer block: ~4500µm × 4500µm (~20mm²)
#   - Column spacing: 5000µm (allows 500µm routing channels)
#   - Row spacing: 4700µm (allows routing channels)
#
# Dataflow: Sequential processing through layers 0→11
#   Layer routing pattern (to minimize wire length):
#     Row 0: Layer 0 → Layer 1 → Layer 2
#     Row 1: Layer 5 ← Layer 4 ← Layer 3 (snake back)
#     Row 2: Layer 6 → Layer 7 → Layer 8
#     Row 3: Layer 11 ← Layer 10 ← Layer 9 (snake back)
#
# =============================================================================

# -----------------------------------------------------------------------------
# Transformer Layer 0 (Top-Left)
# First layer processes embedded patches from sequence memory
# -----------------------------------------------------------------------------
gen_transformer_layers\[0\].u_transformer_layer 500 500 N

# -----------------------------------------------------------------------------
# Transformer Layer 1 (Top-Center)
# Receives from Layer 0
# -----------------------------------------------------------------------------
gen_transformer_layers\[1\].u_transformer_layer 5500 500 N

# -----------------------------------------------------------------------------
# Transformer Layer 2 (Top-Right)
# Receives from Layer 1
# -----------------------------------------------------------------------------
gen_transformer_layers\[2\].u_transformer_layer 10500 500 N

# -----------------------------------------------------------------------------
# Transformer Layer 3 (Row 1, Right) - Snake back
# Receives from Layer 2 (above)
# -----------------------------------------------------------------------------
gen_transformer_layers\[3\].u_transformer_layer 10500 5200 N

# -----------------------------------------------------------------------------
# Transformer Layer 4 (Row 1, Center)
# Receives from Layer 3
# -----------------------------------------------------------------------------
gen_transformer_layers\[4\].u_transformer_layer 5500 5200 N

# -----------------------------------------------------------------------------
# Transformer Layer 5 (Row 1, Left)
# Receives from Layer 4
# -----------------------------------------------------------------------------
gen_transformer_layers\[5\].u_transformer_layer 500 5200 N

# -----------------------------------------------------------------------------
# Transformer Layer 6 (Row 2, Left) - Snake forward
# Receives from Layer 5 (above)
# -----------------------------------------------------------------------------
gen_transformer_layers\[6\].u_transformer_layer 500 9900 N

# -----------------------------------------------------------------------------
# Transformer Layer 7 (Row 2, Center)
# Receives from Layer 6
# -----------------------------------------------------------------------------
gen_transformer_layers\[7\].u_transformer_layer 5500 9900 N

# -----------------------------------------------------------------------------
# Transformer Layer 8 (Row 2, Right)
# Receives from Layer 7
# -----------------------------------------------------------------------------
gen_transformer_layers\[8\].u_transformer_layer 10500 9900 N

# -----------------------------------------------------------------------------
# Transformer Layer 9 (Row 3, Right) - Snake back
# Receives from Layer 8 (above)
# -----------------------------------------------------------------------------
gen_transformer_layers\[9\].u_transformer_layer 10500 14600 N

# -----------------------------------------------------------------------------
# Transformer Layer 10 (Row 3, Center)
# Receives from Layer 9
# -----------------------------------------------------------------------------
gen_transformer_layers\[10\].u_transformer_layer 5500 14600 N

# -----------------------------------------------------------------------------
# Transformer Layer 11 (Row 3, Left)
# Final transformer layer, outputs to Final LayerNorm
# -----------------------------------------------------------------------------
gen_transformer_layers\[11\].u_transformer_layer 500 14600 N

# -----------------------------------------------------------------------------
# Final LayerNorm Block
# Placed in remaining space (right side)
# Processes CLS token before output
# -----------------------------------------------------------------------------
u_final_layer_norm 15200 7000 N

# =============================================================================
# I/O and Control Logic Regions (remaining area)
# =============================================================================
# Patch embedding logic: near top-left (close to Layer 0 input)
# CLS output buffer: near Final LayerNorm
# Weight bus multiplexing: distributed along right edge
# Sequence memory interface: along left edge
#
# =============================================================================
# Routing Considerations
# =============================================================================
# 1. Primary data bus: 768×8-bit = 6144 wires between layers
#    - Use metal layers 4-5 for horizontal routing
#    - Use metal layers 3-4 for vertical routing
#
# 2. Weight memory bus: Shared among all layers
#    - Route along right edge of die
#    - Use layer_idx to select which block receives weights
#
# 3. Control signals: Low-fanout, can use any layer
#
# 4. Clock distribution: H-tree from center
#    - CTS will handle automatically
#    - Expect ~500ps skew across die
# =============================================================================
