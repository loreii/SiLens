# =============================================================================
# SiLens SoC Top-Level Macro Placement
# =============================================================================
# Die: 26000µm × 30770µm = 800mm²
# 
# Floorplan:
#
#    0         8000       16000      26000
#    +----------+----------+---------+ 30770
#    |          |                    |
#    |   DDR3   |                    |
#    | MEMORY   |                    |
#    | (50mm²)  |   LLM SUBSYSTEM    |
#    +----------+   (400mm²)         | 20100
#    |          |                    |
#    |   IO     |                    |
#    | (30mm²)  |                    |
#    +----------+--------------------+ 15870
#    |                               |
#    |      VISION SUBSYSTEM         |
#    |          (250mm²)             |
#    |                               |
#    +-------------------------------+ 100
#   100                              25900
#
# Macro placement format: <instance_name> <x> <y> <orientation>
# Orientations: N (north), S (south), E (east), W (west), FN, FS, FE, FW
# =============================================================================

# Vision Subsystem: ~250mm² (15800µm × 15770µm)
# Position: Bottom section spanning most of die width
# Houses 12 vision transformer blocks in 3×4 grid
u_vision  100 100 N

# LLM Subsystem: ~400mm² (9900µm × 20000µm)  
# Position: Right side from vision to top
# Houses 30 LLM transformer blocks (weight-shared)
u_llm  16000 100 N

# Memory Subsystem: ~50mm² (7100µm × 7100µm)
# Position: Upper left, adjacent to DDR3 IOs on north edge
# Contains DDR3 PHY + controller + AXI arbiter
u_memory  100 16000 N

# IO Subsystem: ~30mm² (5500µm × 5500µm)
# Position: Left side between vision and memory
# Contains host interface, SPI, GPIO, interrupt controller
u_io  100 23200 N

# =============================================================================
# Routing Channels
# =============================================================================
# Horizontal channel between vision and upper subsystems: y = 15870-16000
# Vertical channel between left (vision/memory/io) and LLM: x = 15900-16000
#
# Key signal routes:
# - Vision→Projector→LLM: Through channel at y=15870
# - Memory→LLM (KV cache): Through vertical channel
# - Memory→Vision (activations): Through vertical channel
# - IO→All subsystems: Via routing channels
# =============================================================================
