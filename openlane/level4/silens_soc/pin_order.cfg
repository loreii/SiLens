# =============================================================================
# SiLens SoC Pin Order Configuration
# =============================================================================
# Die: 26000µm × 30770µm
# IO placement strategy:
#   - North: DDR3 interface (high-speed, near memory subsystem)
#   - East: Host parallel interface (32-bit data bus)
#   - South: Clock, reset, power pads
#   - West: SPI, JTAG, GPIO, status LEDs
# =============================================================================

#N  (North - DDR3 Interface)
ddr3_addr\[*\]
ddr3_ba\[*\]
ddr3_cas_n
ddr3_ck_p
ddr3_ck_n
ddr3_cke
ddr3_cs_n
ddr3_dm\[*\]
ddr3_dq\[*\]
ddr3_dqs_p\[*\]
ddr3_dqs_n\[*\]
ddr3_odt
ddr3_ras_n
ddr3_reset_n
ddr3_we_n

#E  (East - Host Parallel Interface)
host_clk
host_data_in\[*\]
host_data_out\[*\]
host_data_oe
host_addr\[*\]
host_rd_n
host_wr_n
host_cs_n
host_ready
host_irq

#S  (South - Clock, Reset, Power)
clk_ref
rst_n

#W  (West - SPI, JTAG, GPIO)
spi_clk
spi_mosi
spi_miso
spi_cs_n
jtag_tck
jtag_tms
jtag_tdi
jtag_tdo
jtag_trst_n
gpio_in\[*\]
gpio_out\[*\]
gpio_oe\[*\]
status_led\[*\]
heartbeat
error_led
