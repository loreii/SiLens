# =============================================================================
# Pin Order Configuration for Projector Block
# =============================================================================
# Organizes pins for clean routing in Level 3 integration
#
# Layout:
#   - Left:   Patch streaming input from vision encoder
#   - Right:  Token streaming output to LLM decoder
#   - Top:    Weight memory interface (Linear1 - larger)
#   - Bottom: Weight memory interface (Linear2), control signals

#S  (South - Bottom edge)
w2_rd_en
w2_row_addr\[.*\]
w2_data\[.*\]
num_patches\[.*\]
busy
patches_processed\[.*\]

#N  (North - Top edge)
w1_rd_en
w1_row_addr\[.*\]
w1_data\[.*\]

#W  (West - Left edge)
clk
rst_n
patch_valid_in
patch_ready_in
patch_data_in\[.*\]
patch_last_in

#E  (East - Right edge)
token_valid_out
token_ready_out
token_data_out\[.*\]
token_last_out
