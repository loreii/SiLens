# ==============================================================================
# Macro Placement Configuration for transformer_block_llm
# ==============================================================================
# Target area: 3600µm × 3600µm (~13mm²)
#
# Layout strategy:
#   - RMS Norm blocks at top (input flow)
#   - 9 Attention heads in 3×3 grid in middle
#   - MLP block at bottom (output flow)
#   - Routing channels between macro groups
#
# Format: macro_name X Y orientation
# Coordinates in microns from lower-left corner
# Orientations: N (north), S, E, W, FN (flipped north), FS, FE, FW
# ==============================================================================

# ------------------------------------------------------------------------------
# RMS Norm 1 (Pre-Attention) - Top left
# Size: ~700µm × 700µm
# ------------------------------------------------------------------------------
u_rms_norm_1 100 2800 N

# ------------------------------------------------------------------------------
# RMS Norm 2 (Pre-MLP) - Top right  
# Size: ~700µm × 700µm
# ------------------------------------------------------------------------------
u_rms_norm_2 2800 2800 N

# ------------------------------------------------------------------------------
# Attention Heads - 3×3 grid in center
# Each head: ~1400µm × 1400µm
# Grid spacing: ~100µm for routing channels
# Starting position: (100, 1200) to (3400, 2700)
# ------------------------------------------------------------------------------
# Row 0 (bottom row of attention grid)
gen_attention_heads[0].u_attention_head 100 1200 N
gen_attention_heads[1].u_attention_head 1200 1200 N
gen_attention_heads[2].u_attention_head 2300 1200 N

# Row 1 (middle row)
gen_attention_heads[3].u_attention_head 100 1600 N
gen_attention_heads[4].u_attention_head 1200 1600 N
gen_attention_heads[5].u_attention_head 2300 1600 N

# Row 2 (top row of attention grid - closer to RMS norm)
gen_attention_heads[6].u_attention_head 100 2000 N
gen_attention_heads[7].u_attention_head 1200 2000 N
gen_attention_heads[8].u_attention_head 2300 2000 N

# ------------------------------------------------------------------------------
# MLP Block - Bottom center
# Size: ~1700µm × 1700µm
# Centered horizontally, positioned for output flow
# ------------------------------------------------------------------------------
u_mlp_block 950 100 N
