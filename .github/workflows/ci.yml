# =============================================================================
# SiLens CI Pipeline
# =============================================================================
# Comprehensive CI workflow for SiLens vision-language AI accelerator
#
# This workflow runs on every push and pull request to verify:
#   - Python code quality (flake8 linting)
#   - Python tests (pytest with coverage)
#   - Verilog syntax (iverilog)
#   - RTL linting (verilator --lint-only)
#   - Smoke tests (quick sanity checks)
#
# License: Apache 2.0
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  VERILOG_STD: '-g2012'

jobs:
  # ===========================================================================
  # Python Linting
  # ===========================================================================
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-docstrings flake8-bugbear

      - name: Run flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 \
            --statistics --ignore=E501,W503,D100,D101,D102,D103,D104,D105,D107

  # ===========================================================================
  # Smoke Tests (Quick Sanity Checks)
  # ===========================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Run smoke tests
        run: |
          pytest tests/smoke/ -v --tb=short -x

  # ===========================================================================
  # Python Tests with Coverage
  # ===========================================================================
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [lint-python, smoke-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist numpy pyyaml toml tqdm
          if [ -f setup.py ]; then pip install -e .; fi

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_model_full.py \
            --ignore=tests/test_synthesis.py \
            --cov=model --cov=tests \
            --cov-report=xml \
            --cov-report=term-missing \
            -x --timeout=120 \
            || echo "::warning::Some tests failed or were skipped"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # Golden Model Tests
  # ===========================================================================
  test-golden:
    name: Golden Model Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Run golden model tests
        run: |
          pytest tests/golden/ -v --tb=short -x --timeout=60 \
            || echo "::warning::Golden model tests incomplete"
        continue-on-error: true

  # ===========================================================================
  # Verilog Syntax Check
  # ===========================================================================
  lint-verilog:
    name: Verilog Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Check Verilog version
        run: iverilog -V

      - name: Compile Verilog files
        run: |
          VERILOG_FILES=$(find rtl -name "*.v" -not -name "*_tb.v" -type f)
          
          if [ -z "$VERILOG_FILES" ]; then
            echo "No Verilog files found"
            exit 0
          fi
          
          echo "Checking Verilog syntax for:"
          echo "$VERILOG_FILES" | tr ' ' '\n'
          
          iverilog ${{ env.VERILOG_STD }} -Wall \
            -Irtl/common \
            -Irtl/top \
            -Irtl/vision_encoder \
            -Irtl/projector \
            -Irtl/language_model \
            -o /dev/null \
            $VERILOG_FILES
          
          echo "✓ Verilog syntax check passed"

  # ===========================================================================
  # RTL Linting with Verilator
  # ===========================================================================
  lint-rtl:
    name: RTL Lint (Verilator)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Check Verilator version
        run: verilator --version

      - name: Lint RTL with Verilator
        run: |
          # Find all non-testbench Verilog files
          VERILOG_FILES=$(find rtl -name "*.v" -not -name "*_tb.v" -not -path "*/tb/*" -type f)
          
          if [ -z "$VERILOG_FILES" ]; then
            echo "No Verilog files found for linting"
            exit 0
          fi
          
          echo "Linting Verilog files:"
          echo "$VERILOG_FILES" | tr ' ' '\n'
          
          # Run verilator lint-only on each file
          for file in $VERILOG_FILES; do
            echo "Linting: $file"
            verilator --lint-only -Wall \
              -Irtl/common \
              -Irtl/top \
              -Irtl/vision_encoder \
              -Irtl/projector \
              -Irtl/language_model \
              $file 2>&1 || echo "::warning::Lint issues in $file"
          done
          
          echo "✓ RTL linting complete"
        continue-on-error: true

  # ===========================================================================
  # Verilog Simulation (Smoke Test)
  # ===========================================================================
  sim-verilog:
    name: Verilog Simulation
    runs-on: ubuntu-latest
    needs: lint-verilog
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run popcount testbench
        run: |
          cd rtl/common
          
          if grep -q "SIMULATION" popcount.v; then
            echo "Running popcount testbench..."
            iverilog ${{ env.VERILOG_STD }} -DSIMULATION -o popcount_test popcount.v
            vvp popcount_test
          else
            echo "No testbench found in popcount.v"
          fi

  # ===========================================================================
  # Code Formatting Check
  # ===========================================================================
  format-check:
    name: Code Format
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install formatters
        run: pip install black isort

      - name: Check black formatting
        run: black --check --diff . || echo "::warning::Code formatting issues found"
        continue-on-error: true

      - name: Check import ordering
        run: isort --check-only --diff . || echo "::warning::Import ordering issues found"
        continue-on-error: true

  # ===========================================================================
  # Type Checking
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pip install mypy numpy types-PyYAML

      - name: Run mypy
        run: |
          mypy model/ tools/ --ignore-missing-imports --no-error-summary \
            || echo "::warning::Type checking issues found"
        continue-on-error: true

  # ===========================================================================
  # Integration Tests
  # ===========================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python, test-golden]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pyyaml

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short --timeout=120 \
            --ignore=tests/integration/test_model_accuracy.py \
            || echo "::warning::Some integration tests failed"
        continue-on-error: true

  # ===========================================================================
  # Regression Tests
  # ===========================================================================
  test-regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: [test-python]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Run regression tests
        run: |
          pytest tests/regression/ -v --tb=short -m "regression and not slow" \
            --timeout=120 || echo "::warning::Some regression tests failed"
        continue-on-error: true

  # ===========================================================================
  # Fuzz Tests
  # ===========================================================================
  test-fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    needs: [test-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy hypothesis

      - name: Run fuzz tests
        run: |
          pytest tests/fuzz/ -v --tb=short --timeout=300 \
            --hypothesis-seed=42 \
            || echo "::warning::Some fuzz tests failed"
        continue-on-error: true

  # ===========================================================================
  # Synthesis Smoke Test
  # ===========================================================================
  synthesis-check:
    name: Synthesis Check
    runs-on: ubuntu-latest
    needs: lint-verilog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Check Yosys version
        run: yosys -V

      - name: Run synthesis smoke test
        run: |
          # Try to synthesize a small module
          cd rtl/common
          
          if [ -f popcount.v ]; then
            echo "Synthesizing popcount module..."
            yosys -p "read_verilog -sv popcount.v; synth; stat" \
              || echo "::warning::Synthesis issues found"
          fi
        continue-on-error: true

  # ===========================================================================
  # CI Summary
  # ===========================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint-python, smoke-tests, test-python, lint-verilog, format-check]
    if: always()
    
    steps:
      - name: Check status
        run: |
          echo "CI Pipeline Summary"
          echo "==================="
          echo "Python Lint: ${{ needs.lint-python.result }}"
          echo "Smoke Tests: ${{ needs.smoke-tests.result }}"
          echo "Python Tests: ${{ needs.test-python.result }}"
          echo "Verilog Lint: ${{ needs.lint-verilog.result }}"
          echo "Format Check: ${{ needs.format-check.result }}"
          
          # Fail if critical jobs failed
          if [[ "${{ needs.lint-python.result }}" == "failure" ]] || \
             [[ "${{ needs.smoke-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.lint-verilog.result }}" == "failure" ]]; then
            echo "::error::Critical CI checks failed"
            exit 1
          fi
          
          echo "✓ CI Pipeline completed"
