# =============================================================================
# SiLens CI Pipeline
# =============================================================================
# GitHub Actions workflow for continuous integration
#
# This workflow runs on every push and pull request to verify:
#   - Python code quality (flake8 linting)
#   - Python tests (pytest)
#   - Verilog syntax (iverilog)
#
# Additional checks for release branches:
#   - Type checking (mypy)
#   - Code formatting (black)
#   - Documentation build
#
# License: Apache 2.0
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:  # Allow manual triggers

env:
  PYTHON_VERSION: '3.10'
  VERILOG_STD: '-g2012'

jobs:
  # ===========================================================================
  # Python Linting
  # ===========================================================================
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-docstrings flake8-bugbear

      - name: Run flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max complexity is 10.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 \
            --statistics --ignore=E501,W503,D100,D101,D102,D103,D104,D105,D107

  # ===========================================================================
  # Python Tests
  # ===========================================================================
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint-python
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist numpy
          # Install minimal dependencies for testing (skip large ML packages)
          pip install pyyaml toml tqdm
          # Install package in development mode if setup.py exists
          if [ -f setup.py ]; then pip install -e .; fi

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_model_full.py \
            --ignore=tests/test_synthesis.py \
            -x --timeout=60 \
            || echo "::warning::Some tests failed or were skipped"
        continue-on-error: true

      - name: Run conversion tests
        run: |
          # Test weight conversion utilities (don't require ML models)
          python -c "from model.conversion.weights_to_verilog import sanitize_name; assert sanitize_name('test.layer.0') == 'test_layer_0'"
          python -c "from model.conversion.weights_to_verilog import categorize_layer; assert categorize_layer('vision_encoder.block0') == 'vision_encoder'"

  # ===========================================================================
  # Verilog Syntax Check
  # ===========================================================================
  lint-verilog:
    name: Verilog Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Check Verilog version
        run: iverilog -V

      - name: Compile Verilog files
        run: |
          # Find all Verilog files (excluding testbenches)
          VERILOG_FILES=$(find rtl -name "*.v" -not -name "*_tb.v" -type f)
          
          if [ -z "$VERILOG_FILES" ]; then
            echo "No Verilog files found"
            exit 0
          fi
          
          echo "Checking Verilog syntax for:"
          echo "$VERILOG_FILES" | tr ' ' '\n'
          echo ""
          
          # Compile with syntax check only
          iverilog ${{ env.VERILOG_STD }} -Wall \
            -Irtl/common \
            -Irtl/top \
            -Irtl/vision_encoder \
            -Irtl/projector \
            -Irtl/language_model \
            -o /dev/null \
            $VERILOG_FILES
          
          echo "✓ Verilog syntax check passed"

      - name: Check testbenches separately
        run: |
          # Find testbench files
          TB_FILES=$(find rtl -name "*_tb.v" -type f 2>/dev/null || true)
          
          if [ -z "$TB_FILES" ]; then
            echo "No testbench files found"
            exit 0
          fi
          
          echo "Checking testbench syntax:"
          echo "$TB_FILES" | tr ' ' '\n'
          
          # All Verilog files for include
          ALL_VERILOG=$(find rtl -name "*.v" -type f)
          
          for tb in $TB_FILES; do
            echo "Checking: $tb"
            iverilog ${{ env.VERILOG_STD }} -Wall \
              -Irtl/common \
              -Irtl/top \
              -o /dev/null \
              $ALL_VERILOG 2>&1 || echo "Warning: Issues in $tb"
          done

  # ===========================================================================
  # Code Formatting Check
  # ===========================================================================
  format-check:
    name: Code Format
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install formatters
        run: pip install black isort

      - name: Check black formatting
        run: black --check --diff . || echo "::warning::Code formatting issues found"
        continue-on-error: true

      - name: Check import ordering
        run: isort --check-only --diff . || echo "::warning::Import ordering issues found"
        continue-on-error: true

  # ===========================================================================
  # Type Checking (Optional)
  # ===========================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pip install mypy numpy types-PyYAML

      - name: Run mypy
        run: |
          mypy model/ tools/ --ignore-missing-imports --no-error-summary \
            || echo "::warning::Type checking issues found"
        continue-on-error: true

  # ===========================================================================
  # Verilog Simulation (Smoke Test)
  # ===========================================================================
  sim-verilog:
    name: Verilog Simulation
    runs-on: ubuntu-latest
    needs: lint-verilog
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run popcount testbench
        run: |
          cd rtl/common
          
          # Check if testbench exists in popcount.v
          if grep -q "SIMULATION" popcount.v; then
            echo "Running popcount testbench..."
            iverilog ${{ env.VERILOG_STD }} -DSIMULATION -o popcount_test popcount.v
            vvp popcount_test
          else
            echo "No testbench found in popcount.v, skipping"
          fi

  # ===========================================================================
  # Build Documentation
  # ===========================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Build documentation
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
            echo "✓ Documentation built successfully"
          else
            echo "No mkdocs.yml found, skipping documentation build"
          fi
        continue-on-error: true

  # ===========================================================================
  # CI Summary
  # ===========================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, lint-verilog, format-check]
    if: always()
    
    steps:
      - name: Check status
        run: |
          echo "CI Pipeline Summary"
          echo "==================="
          echo "Python Lint: ${{ needs.lint-python.result }}"
          echo "Python Tests: ${{ needs.test-python.result }}"
          echo "Verilog Lint: ${{ needs.lint-verilog.result }}"
          echo "Format Check: ${{ needs.format-check.result }}"
          
          # Fail if any critical job failed
          if [[ "${{ needs.lint-python.result }}" == "failure" ]] || \
             [[ "${{ needs.lint-verilog.result }}" == "failure" ]]; then
            echo "::error::Critical CI checks failed"
            exit 1
          fi
          
          echo "✓ CI Pipeline completed"
